services:
  web:
    command: >-
      .venv/bin/python manage.py runserver 0.0.0.0:$PORT
    health: /health/
    portal:
      title: FX Forecast Lab
      description: Private FX research dashboard with governed model recommendations.
  scheduler:
    command: >-
      .venv/bin/python manage.py run_scheduler
  worker:
    command: >-
      .venv/bin/python manage.py run_worker
